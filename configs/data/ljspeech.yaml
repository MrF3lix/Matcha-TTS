_target_: matcha.data.text_mel_datamodule.TextMelDataModule
name: ljspeech
train_filelist_path: data/filelists/ljs_audio_text_train_filelist.txt
valid_filelist_path: data/filelists/ljs_audio_text_val_filelist.txt
batch_size: 32
num_workers: 20
pin_memory: True
cleaners: [english_cleaners2]
add_blank: True
n_spks: 1
n_fft: 1024
n_feats: 80
sample_rate: 22050
hop_length: 256
win_length: 1024
f_min: 0
f_max: 8000
mel_frontend: hifigan   # HiFi-GAN-style mel; see ljspeech_vocbulwark.yaml for the other
data_statistics:  # Computed for ljspeech dataset
  mel_mean: 0.16585318744182587
  mel_std: 0.4276588261127472
seed: ${seed}
load_durations: false
