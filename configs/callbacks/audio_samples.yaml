audio_samples:
  _target_: matcha.callbacks.LogAudioSamples

  # Which vocoder to drive: vocbulwark (96-mel front-end) or hifigan_T2_v1 / hifigan_univ_v1
  # (80-mel front-end). See callbacks/hifigan.yaml for the latter.
  vocoder: vocbulwark

  # Produced by scripts/compute_speaker_embedding.py. The vocoder is speaker-conditioned and
  # cannot run without it, so this path is checked when the callback is constructed.
  speaker_embedding: data/ljspeech_speaker_embedding.pt

  n_samples: 2
  every_n_epochs: 1
  n_timesteps: 10

  vocoder_device: cuda

  # Copy-synthesis of the real mels, logged once as a fixed reference: it is the best the
  # vocoder can sound, so it tells you how much of any remaining gap is the acoustic model.
  log_ground_truth: true
